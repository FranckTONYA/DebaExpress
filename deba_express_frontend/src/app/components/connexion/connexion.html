<div class="min-h-screen bg-deba-bg flex flex-col items-center justify-center p-4 font-sans relative overflow-hidden text-base">
  
  <!-- Éléments de fond décoratifs d'ambiance aéronautique -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-deba-light opacity-30 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-deba-steel opacity-20 rounded-full blur-3xl"></div>

  <!-- 💡 BOUTON RETOUR ACCUEIL SÉCURISÉ HAUT DE PAGE -->
  <div class="mb-6 relative z-10 w-full max-w-md flex justify-end">
    <a routerLink="/" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 border border-slate-200/80 px-4 py-2.5 rounded-xl text-xs font-bold text-[#486581] transition-all shadow-sm cursor-pointer">
      <svg class="w-4 h-4 text-[#486581]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span>Retour à l'accueil</span>
    </a>
  </div>

  <!-- Conteneur Principal de la Carte de Connexion -->
  <div class="w-full max-w-md bg-white border border-slate-100 rounded-3xl shadow-xl overflow-hidden relative z-10">
    
    <!-- 💡 HEADER REVISÉ : LOGO CLIQUABLE ET IDENTITÉ DE MARQUE -->
    <div class="bg-deba-dark text-white px-8 py-8 text-center relative flex flex-col items-center justify-center">
      <div class="absolute top-4 right-6 text-5xl opacity-10 pointer-events-none">✈️</div>
      
      <!-- Logo cliquable connecté au Routeur -->
      <a routerLink="/" class="cursor-pointer group select-none block mb-3">
        <img src="logo.jpg" alt="Logo Deba Express" class="w-16 h-16 rounded-2xl object-cover shadow-lg bg-white border-2 border-white transition-transform group-hover:scale-105 duration-200">
      </a>

      <h2 class="text-2xl font-black tracking-wide uppercase">Deba Express</h2>
      <p class="text-xs text-slate-300 font-medium mt-1 tracking-wider">Espace d'authentification sécurisé</p>
    </div>

    <!-- Corps du Formulaire -->
    <div class="p-8">
      
      <!-- Affichage réactif de l'alerte d'erreur -->
      @if (erreurMessage()) {
        <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-xl text-red-700 text-sm flex items-center gap-2 animate-pulse">
          <span>⚠️</span>
          <p class="font-bold">{{ erreurMessage() }}</p>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Champ Email -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Identifiant de connexion (Email)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">📧</span>
            <input 
              type="email" 
              name="email"
              [ngModel]="email()" 
              (ngModelChange)="email.set($event)"
              placeholder="votre-adresse@deba.com" 
              class="w-full bg-slate-50 border border-slate-200 text-deba-dark rounded-xl pl-11 pr-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-deba-steel focus:bg-white transition-all font-medium"
              required
            >
          </div>
        </div>

        <!-- Champ Mot de Passe -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Mot de passe</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">🔒</span>
            <input 
              [type]="masquerMotDePasse() ? 'password' : 'text'" 
              name="motDePasse"
              [ngModel]="motDePasse()" 
              (ngModelChange)="motDePasse.set($event)"
              placeholder="••••••••••••" 
              class="w-full bg-slate-50 border border-slate-200 text-deba-dark rounded-xl pl-11 pr-12 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-deba-steel focus:bg-white transition-all font-medium"
              required
            >
            <!-- Bouton Afficher / Masquer -->
            <button type="button" (click)="toggleMasquerMotDePasse()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-deba-steel cursor-pointer">
              {{ masquerMotDePasse() ? '👁️' : '🙈' }}
            </button>
          </div>
        </div>

        <!-- Option Se souvenir de moi -->
        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="remember" 
            class="w-4 h-4 text-deba-dark border-slate-300 rounded focus:ring-deba-steel"
          >
          <label for="remember" class="ml-2 text-xs font-bold text-slate-500 cursor-pointer select-none">
            Rester connecté sur cet appareil
          </label>
        </div>

        <!-- Bouton d'action principal -->
        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="w-full bg-deba-dark hover:bg-opacity-95 text-white font-black py-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer"
        >
          @if (isLoading()) {
            <span class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span>Vérification en cours...</span>
          } @else {
            <span>🚀 Se connecter à l'espace</span>
          }
        </button>

      </form>
    </div>

    <!-- Footer de la carte -->
    <div class="bg-slate-50 border-t border-slate-100 px-8 py-5 text-center text-xs text-slate-400 font-bold">
      Deba Express Premium v1.0 • Solution Sécurisée JWT
    </div>

  </div>
</div>
