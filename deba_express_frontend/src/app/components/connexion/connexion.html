<div class="min-h-screen bg-deba-bg flex items-center justify-center p-4 font-sans relative overflow-hidden">
  
  <!-- Éléments de fond décoratifs d'ambiance aéronautique -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-deba-light opacity-30 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-deba-steel opacity-20 rounded-full blur-3xl"></div>

  <!-- Conteneur Principal de la Carte de Connexion -->
  <div class="w-full max-w-md bg-white border border-slate-100 rounded-3xl shadow-xl overflow-hidden relative z-10">
    
    <!-- Header de la carte aux couleurs du logo -->
    <div class="bg-deba-dark text-white px-8 py-10 text-center relative">
      <div class="absolute top-4 right-6 text-5xl opacity-10 pointer-events-none">✈️</div>
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white text-deba-dark rounded-full shadow-lg text-2xl font-bold mb-4">
        DE
      </div>
      <h2 class="text-2xl font-extrabold tracking-wide uppercase">Deba Express</h2>
      <p class="text-xs text-slate-300 font-medium mt-1 tracking-wider">Espace d'authentification sécurisé</p>
    </div>

    <!-- Corps du Formulaire -->
    <div class="p-8">
      
      <!-- Affichage réactif de l'alerte d'erreur -->
      @if (erreurMessage()) {
        <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-xl text-red-700 text-sm flex items-center gap-2 animate-pulse">
          <span>⚠️</span>
          <p class="font-medium">{{ erreurMessage() }}</p>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Champ Email -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Identifiant de connexion (Email)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">📧</span>
            <input 
              type="email" 
              name="email"
              [ngModel]="email()" 
              (ngModelChange)="email.set($event)"
              placeholder="votre-adresse@deba.com" 
              class="w-full bg-slate-50 border border-slate-200 text-deba-dark rounded-xl pl-11 pr-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-deba-steel focus:bg-white transition-all"
              required
            >
          </div>
        </div>

        <!-- Champ Mot de Passe -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Mot de passe</label>
            <a href="#" class="text-xs font-semibold text-deba-steel hover:underline">Oublié ?</a>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">🔒</span>
            <input 
              type="password" 
              name="motDePasse"
              [ngModel]="motDePasse()" 
              (ngModelChange)="motDePasse.set($event)"
              placeholder="••••••••••••" 
              class="w-full bg-slate-50 border border-slate-200 text-deba-dark rounded-xl pl-11 pr-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-deba-steel focus:bg-white transition-all"
              required
            >
          </div>
        </div>

        <!-- Option Se souvenir de moi -->
        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="remember" 
            class="w-4 h-4 text-deba-dark border-slate-300 rounded focus:ring-deba-steel"
          >
          <label for="remember" class="ml-2 text-xs font-medium text-slate-500 cursor-pointer select-none">
            Rester connecté sur cet appareil
          </label>
        </div>

        <!-- Bouton d'action principal -->
        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="w-full bg-deba-dark hover:bg-opacity-95 text-white font-bold py-4 rounded-xl shadow-md transition-all transform active:scale-98 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          @if (isLoading()) {
            <span class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span>Vérification en cours...</span>
          } @else {
            <span>🚀 Se connecter à l'espace</span>
          }
        </button>

      </form>
    </div>

    <!-- Footer de la carte -->
    <div class="bg-slate-50 border-t border-slate-100 px-8 py-5 text-center text-xs text-slate-400 font-medium">
      Deba Express Premium v1.0 • Solution Sécurisée JWT
    </div>

  </div>
</div>
